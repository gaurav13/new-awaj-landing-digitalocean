name: Auto-merge v0 PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "v0/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-v0-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  auto-merge-from-push:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v0/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or reuse PR, squash merge, and sync main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "Processing v0 branch push: ${BRANCH}"

          PR_NUM="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"

          if [ -z "${PR_NUM}" ]; then
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "Auto-merge ${BRANCH}" \
              --body "Automated merge of a v0 branch into main."
            PR_NUM="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number')"
            echo "Created PR #${PR_NUM}"
          else
            echo "Reusing existing open PR #${PR_NUM} for ${BRANCH}"
          fi

          MERGED=false
          for attempt in $(seq 1 20); do
            STATE="$(gh pr view "${PR_NUM}" --json state --jq '.state')"
            if [ "${STATE}" = "MERGED" ]; then
              echo "PR #${PR_NUM} is already merged"
              MERGED=true
              break
            fi

            MERGEABLE="$(gh pr view "${PR_NUM}" --json mergeable --jq '.mergeable')"
            MERGE_STATE="$(gh pr view "${PR_NUM}" --json mergeStateStatus --jq '.mergeStateStatus')"

            if [ "${MERGEABLE}" = "CONFLICTING" ]; then
              echo "PR #${PR_NUM} has merge conflicts (${MERGE_STATE})"
              exit 1
            fi

            if [ "${MERGEABLE}" = "MERGEABLE" ]; then
              gh pr merge "${PR_NUM}" --squash --delete-branch
              echo "Squash-merged PR #${PR_NUM} and deleted ${BRANCH}"
              MERGED=true
              break
            fi

            echo "Waiting for PR #${PR_NUM} to become mergeable (${MERGE_STATE}, attempt ${attempt}/20)..."
            sleep 5
          done

          if [ "${MERGED}" != "true" ]; then
            echo "Timed out waiting to merge PR #${PR_NUM}"
            exit 1
          fi

          git fetch origin main --force
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "Synced main at ${MAIN_SHA}"

  auto-merge-from-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge v0 pull request and sync main
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request
            const headRef = pr.head.ref
            const author = pr.user.login.toLowerCase()

            const isV0Branch = headRef.startsWith("v0/")
            const isV0Author = author === "v0" || (author.includes("v0") && author.endsWith("[bot]"))

            if (!isV0Branch && !isV0Author) {
              core.info(`Skipping PR #${pr.number}: branch "${headRef}" / author "${pr.user.login}" is not v0`)
              return
            }

            const owner = context.repo.owner
            const repo = context.repo.repo
            const prNumber = pr.number

            core.info(`Auto-merging v0 PR #${prNumber} (${headRef} by ${pr.user.login}) into main`)

            async function waitForMergeable() {
              for (let attempt = 1; attempt <= 20; attempt++) {
                const { data: latest } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                })

                if (latest.state === "closed" && latest.merged) {
                  return "merged"
                }

                if (latest.mergeable === false && latest.mergeable_state === "dirty") {
                  throw new Error(`PR #${prNumber} has merge conflicts`)
                }

                if (latest.mergeable === true) {
                  return "ready"
                }

                core.info(
                  `Waiting for PR #${prNumber} to become mergeable (${latest.mergeable_state}, attempt ${attempt}/20)...`,
                )
                await new Promise((resolve) => setTimeout(resolve, 5000))
              }

              throw new Error(`Timed out waiting to merge PR #${prNumber}`)
            }

            const state = await waitForMergeable()

            if (state !== "merged") {
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  merge_method: "squash",
                })
                core.info(`Squash-merged PR #${prNumber}`)
              } catch (error) {
                if (error.status === 405) {
                  core.info(`PR #${prNumber} is already merged or not mergeable`)
                } else {
                  throw error
                }
              }
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${headRef}`,
              })
              core.info(`Deleted branch ${headRef}`)
            } catch (error) {
              core.warning(`Could not delete branch ${headRef}: ${error.message}`)
            }

            const { data: mainRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/main",
            })
            core.info(`Synced main at ${mainRef.object.sha}`)
